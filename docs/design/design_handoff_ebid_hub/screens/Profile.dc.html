<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  html, body{overflow-x:hidden;}
  a{text-decoration:none;}
  a:link, a:visited{color:#C9974C;}
  a:hover{color:#A87A38;}
  @media (max-width:600px){
    .pf-grid{grid-template-columns:1fr !important;}
  }
</style>
</helmet>

<div style="background:#F3F4F8; color:#1E2233; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;">

  <header style="position:sticky; top:0; z-index:60; background:rgba(238,240,234,0.92); backdrop-filter:blur(10px); border-bottom:1px solid #DDE0EA;">
    <div style="max-width:1400px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 20px; gap:12px; min-width:0;">
      <a href="eBid Hub Landing.dc.html" style="display:flex; align-items:center; gap:12px; flex:1; min-width:0; overflow:hidden;">
        <img src="uploads/adwitix-icon.svg" alt="" style="height:36px; width:36px; display:block; flex-shrink:0;">
        <span style="font-family:Georgia,'Cambria',serif; font-weight:800; font-size:22px; letter-spacing:-0.5px; color:#1E2761; flex-shrink:0;">Adwiti<span style="color:#C9974C;">X</span></span>
      </a>
      <a href="#" style="font-weight:700; font-size:12.5px; padding:9px 18px; border-radius:100px; border:1px solid #DDE0EA; color:#1E2233; white-space:nowrap;">Log Out</a>
    </div>
  </header>

  <main style="max-width:760px; margin:0 auto; padding:44px 24px 90px;">

    <div style="display:flex; align-items:center; gap:16px; margin-bottom:32px;">
      <div style="width:64px; height:64px; border-radius:100px; background:#1E2233; color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; flex-shrink:0;">{{ userInitials }}</div>
      <div>
        <h1 style="font-family:Georgia,'Cambria',serif; font-size:24px; font-weight:800; letter-spacing:-0.5px; margin:0 0 4px;">{{ userName }}</h1>
        <p style="font-size:13px; color:#9A9FB5; margin:0;">+91 {{ userMobile }} · Member since {{ memberSince }}</p>
      </div>
    </div>

    <a href="KYC.dc.html" style="display:block; background:#fff; border:1px solid #DDE0EA; border-radius:16px; padding:22px 24px; margin-bottom:28px; color:inherit;" style-hover="border-color:#C9974C;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:16px;">
        <div>
          <p style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:#9A9FB5; margin:0 0 6px;">Identity Verification</p>
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:16px; font-weight:800;">KYC Compliance</span>
            <span style="font-size:11px; font-weight:700; text-transform:uppercase; color:{{ kycColor }}; background:{{ kycBg }}; padding:4px 11px; border-radius:100px;">{{ kycStatusLabel }}</span>
          </div>
          <p style="font-size:12.5px; color:#565B72; margin:8px 0 0; max-width:440px; line-height:1.5;">{{ kycHint }}</p>
        </div>
        <span style="font-size:22px; color:#9A9FB5; flex-shrink:0;">→</span>
      </div>
    </a>

    <div class="pf-grid" style="display:grid; grid-template-columns:repeat(2,1fr); gap:14px;">
      <sc-for list="{{ profileLinks }}" as="l" hint-placeholder-count="6">
        <a href="{{ l.href }}" style="background:#fff; border:1px solid #DDE0EA; border-radius:14px; padding:18px; color:inherit;" style-hover="border-color:#C9974C;">
          <p style="font-size:14px; font-weight:700; margin:0 0 4px;">{{ l.title }}</p>
          <p style="font-size:12px; color:#9A9FB5; margin:0;">{{ l.subtitle }}</p>
        </a>
      </sc-for>
    </div>

  </main>
</div>
</helmet>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;userName&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Ravi Kumar&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;kycStatus&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;verified&quot;, &quot;options&quot;: [&quot;verified&quot;, &quot;pending&quot;, &quot;suspended&quot;], &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const kycStatus = this.props.kycStatus ?? 'verified';
    const kycMap = {
      verified: { label: 'Verified', color: '#3F7A4E', bg: '#E4EFE6', hint: 'Your identity is fully verified. No action needed.' },
      pending: { label: 'Pending', color: '#9C5B1F', bg: '#FBF2E2', hint: 'Your dossier is with your TSX Master for review — usually 1–2 business days.' },
      suspended: { label: 'Suspended', color: '#B5482F', bg: '#FBE8E4', hint: 'A compliance flag needs your attention before you can bid or list again.' }
    };
    const kyc = kycMap[kycStatus] || kycMap.verified;
    const userName = this.props.userName ?? 'Ravi Kumar';
    const userInitials = userName.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    return {
      userName, userInitials,
      userMobile: '98765 43210',
      memberSince: 'Feb 2025',
      kycStatusLabel: kyc.label, kycColor: kyc.color, kycBg: kyc.bg, kycHint: kyc.hint,
      profileLinks: [
        { title: 'Personal Details', subtitle: 'Name, mobile, email', href: '#' },
        { title: 'Preferences', subtitle: 'Categories, notifications', href: 'Preferences.dc.html' },
        { title: 'Invoices', subtitle: 'GST invoices & receipts', href: '#' },
        { title: 'Change mPIN', subtitle: 'Update login PIN via OTP', href: 'Change mPIN.dc.html' },
        { title: 'Delete Account', subtitle: '30-day grace period', href: 'Delete Account.dc.html' },
        { title: 'Saved Searches', subtitle: 'Filters saved from Marketplace', href: 'Saved Searches.dc.html' },
        { title: 'Payout Bank', subtitle: 'Bank account for settlements', href: 'Payout Bank.dc.html' },
        { title: 'Rating History', subtitle: 'Trader★ / Market Maker★ ledger', href: 'Rating History.dc.html' },
        { title: 'Activity Log', subtitle: 'Sessions, device & location', href: 'Activity Log.dc.html' },
        { title: 'Buyer Dashboard', subtitle: 'Bids, offers, purchases', href: 'Buyer Dashboard.dc.html' },
        { title: 'Market Maker Dashboard', subtitle: 'Lots, sales, earnings', href: 'Seller Dashboard.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
