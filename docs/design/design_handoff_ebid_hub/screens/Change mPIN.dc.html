<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;} body{margin:0;} html,body{overflow-x:hidden;} a{text-decoration:none;}
a:link, a:visited{color:#C9974C;} a:hover{color:#A87A38;}
</style>
</helmet>
<div style="background:#F3F4F8; color:#1E2233; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;">
  <header style="position:sticky; top:0; z-index:60; background:rgba(238,240,234,0.92); backdrop-filter:blur(10px); border-bottom:1px solid #DDE0EA;">
    <div style="max-width:480px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 20px;">
      <a href="Profile.dc.html" style="display:flex; align-items:center; gap:12px;">
        <img src="uploads/adwitix-icon.svg" alt="" style="height:34px; width:34px; display:block;">
        <span style="font-family:Georgia,'Cambria',serif; font-weight:800; font-size:20px; letter-spacing:-0.5px; color:#1E2761;">Adwiti<span style="color:#C9974C;">X</span></span>
      </a>
    </div>
  </header>

  <main style="max-width:420px; margin:0 auto; padding:44px 24px 90px;">
    <sc-if value="{{ stage === 'request' }}" hint-placeholder-val="{{ true }}">
      <h1 style="font-family:Georgia,'Cambria',serif; font-size:24px; font-weight:800; letter-spacing:-0.5px; margin:0 0 8px;">Change mPIN</h1>
      <p style="font-size:13.5px; color:#565B72; margin:0 0 22px; line-height:1.6;">We'll send an OTP to your registered mobile to confirm this change.</p>
      <button onClick="{{ onSendOtp }}" style="width:100%; font-size:14px; font-weight:700; padding:13px; border-radius:8px; border:none; cursor:pointer; background:#1E2233; color:#fff;">Send OTP</button>
    </sc-if>

    <sc-if value="{{ stage === 'confirm' }}" hint-placeholder-val="{{ false }}">
      <h1 style="font-family:Georgia,'Cambria',serif; font-size:24px; font-weight:800; letter-spacing:-0.5px; margin:0 0 8px;">Confirm New mPIN</h1>
      <div style="background:#FBF6EC; border:1px solid #E9DCC0; border-radius:10px; padding:12px 14px; margin-bottom:18px; font-size:12.5px; color:#9C7430;"><strong>Dev mode</strong> (SMS provider not yet connected): your OTP is <strong>{{ devOtp }}</strong></div>

      <label style="font-size:11.5px; font-weight:700; color:#9096AC; letter-spacing:0.3px; text-transform:uppercase;">6-digit OTP</label>
      <input placeholder="000000" value="{{ otp }}" onChange="{{ onOtpChange }}" maxlength="6" style="width:100%; padding:12px 14px; margin:6px 0 16px; border:1px solid #DDE0EA; border-radius:8px; font-size:15px; letter-spacing:3px; text-align:center; outline:none; font-family:'IBM Plex Mono',monospace;">

      <label style="font-size:11.5px; font-weight:700; color:#9096AC; letter-spacing:0.3px; text-transform:uppercase;">New 4-digit mPIN</label>
      <input type="password" placeholder="····" value="{{ newMpin }}" onChange="{{ onMpinChange }}" maxlength="4" style="width:100%; padding:12px 14px; margin:6px 0 20px; border:1px solid #DDE0EA; border-radius:8px; font-size:15px; letter-spacing:6px; text-align:center; outline:none; font-family:'IBM Plex Mono',monospace;">

      <button onClick="{{ onConfirm }}" disabled="{{ !valid }}" style="width:100%; font-size:14px; font-weight:700; padding:13px; border-radius:8px; border:none; cursor:pointer; background:{{ valid ? '#1E2233' : '#E9EBF2' }}; color:{{ valid ? '#fff' : '#9A9FB5' }};">Confirm</button>
    </sc-if>

    <sc-if value="{{ stage === 'done' }}" hint-placeholder-val="{{ false }}">
      <div style="background:#E7F0E9; border:1px solid #CBE0D1; border-radius:16px; padding:32px; text-align:center;">
        <div style="font-size:15px; font-weight:800; color:#38724A; margin-bottom:8px;">mPIN Updated</div>
        <p style="font-size:13px; color:#38724A; margin:0 0 18px;">Use your new mPIN the next time you log in.</p>
        <a href="Profile.dc.html" style="font-size:13px; font-weight:700; padding:10px 20px; border-radius:8px; background:#38724A; color:#fff; display:inline-block;">Back to Profile →</a>
      </div>
    </sc-if>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { stage: 'request', otp: '', newMpin: '' };

  renderVals() {
    const s = this.state;
    const valid = s.otp.length === 6 && s.newMpin.length === 4;
    return {
      stage: s.stage, devOtp: '482913',
      onSendOtp: () => this.setState({ stage: 'confirm' }),
      otp: s.otp, onOtpChange: (e) => this.setState({ otp: e.target.value.replace(/\D/g, '').slice(0, 6) }),
      newMpin: s.newMpin, onMpinChange: (e) => this.setState({ newMpin: e.target.value.replace(/\D/g, '').slice(0, 4) }),
      valid, onConfirm: () => { if (valid) this.setState({ stage: 'done' }); },
    };
  }
}

</script>
</body>
</html>
