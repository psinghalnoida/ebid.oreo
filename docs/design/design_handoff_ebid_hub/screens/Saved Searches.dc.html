<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;} body{margin:0;} html,body{overflow-x:hidden;} a{text-decoration:none;}
a:link, a:visited{color:#C9974C;} a:hover{color:#A87A38;}
@media (max-width:640px){.ss-nav{display:none !important;}}
</style>
</helmet>
<div style="background:#F3F4F8; color:#1E2233; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;">
  <header style="position:sticky; top:0; z-index:60; background:rgba(238,240,234,0.92); backdrop-filter:blur(10px); border-bottom:1px solid #DDE0EA;">
    <div style="max-width:720px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 20px;">
      <a href="eBid Hub Landing.dc.html" style="display:flex; align-items:center; gap:12px;">
        <img src="uploads/adwitix-icon.svg" alt="" style="height:34px; width:34px; display:block;">
        <span style="font-family:Georgia,'Cambria',serif; font-weight:800; font-size:20px; letter-spacing:-0.5px; color:#1E2761;">Adwiti<span style="color:#C9974C;">X</span></span>
      </a>
      <nav class="ss-nav" style="display:flex; gap:4px; background:#E9EBF2; padding:4px; border-radius:100px;">
        <a href="Preferences.dc.html" style="font-size:13px; font-weight:600; padding:8px 16px; border-radius:100px; color:#565B72;">Preferences</a>
        <a href="Buyer Dashboard.dc.html" style="font-size:13px; font-weight:600; padding:8px 16px; border-radius:100px; color:#565B72;">Dashboard</a>
      </nav>
    </div>
  </header>

  <main style="max-width:640px; margin:0 auto; padding:36px 20px 100px;">
    <h1 style="font-family:Georgia,'Cambria',serif; font-size:26px; font-weight:800; letter-spacing:-0.5px; margin:0 0 8px;">Saved Searches</h1>
    <p style="font-size:13px; color:#565B72; margin:0 0 24px;">Save a filter combination from <a href="Marketplace.dc.html">Marketplace</a>, then re-run it here anytime.</p>

    <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:36px;">
      <sc-for list="{{ searches }}" as="sv" hint-placeholder-count="3">
        <div style="background:#fff; border:1px solid #DDE0EA; border-radius:12px; padding:16px 18px; display:flex; justify-content:space-between; align-items:center; gap:12px;">
          <div style="min-width:0;">
            <div style="font-size:13.5px; font-weight:700;">{{ sv.label }}</div>
            <div style="font-size:11px; color:#9A9FB5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ sv.query }}</div>
          </div>
          <div style="display:flex; gap:8px; flex-shrink:0;">
            <a href="Marketplace.dc.html" style="font-size:12px; font-weight:700; padding:7px 14px; border-radius:8px; border:1px solid #DDE0EA; background:#fff; color:#1E2233;">Run</a>
            <button onClick="{{ sv.onDelete }}" style="font-size:12px; font-weight:700; padding:7px 14px; border-radius:8px; border:1px solid #F2CFC6; background:#FBE9E5; color:#A93F2A; cursor:pointer;">Delete</button>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{ !searches.length }}" hint-placeholder-val="{{ false }}">
        <p style="font-size:13px; color:#9A9FB5;">No saved searches yet.</p>
      </sc-if>
    </div>

    <h2 style="font-family:Archivo,sans-serif; font-size:16px; font-weight:800; margin:0 0 14px;">Search History</h2>
    <p style="font-size:12px; color:#9A9FB5; margin:0 0 14px;">Your last 20 searches on this platform.</p>
    <div style="background:#fff; border:1px solid #DDE0EA; border-radius:12px; overflow:hidden;">
      <sc-for list="{{ history }}" as="h" hint-placeholder-count="4">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid #EEF0EA; font-size:12.5px;">
          <span style="color:#565B72;">{{ h.query }}</span>
          <a href="Marketplace.dc.html" style="font-size:11.5px; font-weight:700;">Re-run →</a>
        </div>
      </sc-for>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    searches: [
      { label: 'Industrial machinery under ₹5L', query: 'category=Industrial+Machinery&maxValue=500000' },
      { label: 'Vehicles — Easy Auctions near Delhi', query: 'category=Vehicles&format=EASY&loc=Delhi&radius=100' },
    ],
  };

  renderVals() {
    const s = this.state;
    return {
      searches: s.searches.map((sv, i) => ({ ...sv, onDelete: () => { const n = s.searches.slice(); n.splice(i, 1); this.setState({ searches: n }); } })),
      history: [
        { query: 'category=Heavy+Equipment&format=TENDER' },
        { query: 'category=Office+IT+Assets&maxValue=100000' },
        { query: 'format=BUYNOW&loc=Mumbai' },
        { query: 'category=Fleet+Vehicles' },
      ],
    };
  }
}

</script>
</body>
</html>
