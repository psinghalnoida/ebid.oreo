name: Regression suite

# Runs the 39 real, permanent test:* commands (see README.md Step 10)
# against a real MySQL 8 database on every push and pull request. These
# are assertion-based suites, not throwaway scripts -- a failure here
# means something genuinely broke, the same signal SETUP.md asks a human
# deploying to a real server to check by hand.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: ebidhub
          MYSQL_USER: ebidhub_app
          MYSQL_PASSWORD: ci_test_password_not_for_production
          MYSQL_ROOT_PASSWORD: ci_test_root_password_not_for_production
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -pci_test_root_password_not_for_production"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, mysqli, pdo_mysql, intl, gd
          coverage: none

      - name: Install ffmpeg
        # D-43: real server-side video transcoding, exercised by test:media.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure MySQL server (utf8mb4 default)
        # utf8mb4/utf8mb4_unicode_ci to match this project's migrations
        # (see docs/DECISIONS.md's MySQL migration entry) -- the service
        # container's default charset/collation otherwise stays whatever
        # the mysql:8 image ships with.
        run: |
          mysql -h 127.0.0.1 -u root -pci_test_root_password_not_for_production -e "
            ALTER DATABASE ebidhub CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON ebidhub.* TO 'ebidhub_app'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Configure environment
        run: |
          cp env .env
          # 'development', not 'testing' -- these test:* commands are plain
          # spark CLI commands, not PHPUnit. CI_ENVIRONMENT=testing triggers
          # CodeIgniter's PHPUnit-specific bootstrap path (expects a
          # SUPPORTPATH constant that only tests/bootstrap.php defines) and
          # crashes spark's normal CLI bootstrap outright -- caught by
          # actually running this, not assumed.
          sed -i "s/# CI_ENVIRONMENT = production/CI_ENVIRONMENT = development/" .env
          sed -i "s|^# app\.baseURL = ''|app.baseURL = 'http://localhost:8080/'|" .env
          {
            echo "database.default.hostname = 127.0.0.1"
            echo "database.default.database = ebidhub"
            echo "database.default.username = ebidhub_app"
            echo "database.default.password = ci_test_password_not_for_production"
            echo "database.default.DBDriver = MySQLi"
            echo "database.default.port = 3306"
            echo "database.default.charset = utf8mb4"
            echo "database.default.DBCollat = utf8mb4_unicode_ci"
          } >> .env

      - name: Run migrations
        run: php spark migrate --all

      - name: Run the full regression suite
        run: |
          set -e
          FAILED=""
          for cmd in cascade rating lifecycle auth buynow express settlement dispute \
                     scheduler tier3 easyschedule tenderfoundation tenderbidding \
                     tenderreview easyexpresscorrections kyc aml standingreview \
                     payoutcontrol crawlback auditlog sovereignrule servertimecheck \
                     invoices successfee tenantapi media selleraudit phase3a discovery \
                     browse br35 terminology chronicle aiaudit listingreach partydashboards \
                     chargeback domainevents; do
            echo "::group::test:$cmd"
            if ! php spark test:$cmd; then
              FAILED="$FAILED test:$cmd"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "Failed suites:$FAILED"
            exit 1
          fi
          echo "All 39 suites passed."
